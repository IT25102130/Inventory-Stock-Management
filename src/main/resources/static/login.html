<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <!-- Branding Section -->
            <div class="login-branding">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-box-open"></i>
                    </div>
                </div>
                <h1>Inventory Pro</h1>
                <p class="branding-subtitle">Smart Stock Management</p>
            </div>

            <!-- Login Header -->
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your inventory management dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <input
                                type="text"
                                id="username"
                                name="username"
                                required
                                placeholder="Enter your username"
                                autocomplete="username"
                        >
                        <span class="input-icon"><i class="fas fa-check-circle"></i></span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="password"
                                name="password"
                                required
                                placeholder="Enter your password"
                                autocomplete="current-password"
                        >
                        <span class="input-icon"><i class="fas fa-check-circle"></i></span>
                    </div>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="message error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>
                <div id="successMessage" class="message success-message">
                    <i class="fas fa-check-circle"></i>
                    <span id="successText"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="login-footer">
                <p class="footer-text">Don't have access? <a href="#contact">Contact Administrator</a></p>
            </div>
        </div>

        <!-- Side Decoration -->
        <div class="decoration"></div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
